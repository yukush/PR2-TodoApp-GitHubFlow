name: CI / Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle launcher executable
        run: chmod +x gradlew
      - name: Build and run JUnit tests
        run: ./gradlew --no-daemon clean build
      - name: Read project version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: project-version
        shell: bash
        run: echo "version=$(sed -n 's/^version=//p' gradle.properties | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.project-version.outputs.version }}
          name: Release v${{ steps.project-version.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: build/libs/todo-app-${{ steps.project-version.outputs.version }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
